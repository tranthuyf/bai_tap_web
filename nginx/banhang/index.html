<body>

```
<!-- HEADER -->

<header>

    <h1>🌿 WEBSITE BÁN HÀNG</h1>

    <p>
        Nginx + Node-RED + JavaScript
    </p>

</header>


<!-- NỘI DUNG -->

<div class="container">

    <h2>Danh sách hàng hóa</h2>

    <div class="button-area">

        <button onclick="getHangHoa()">
            Lấy danh sách hàng hóa
        </button>

    </div>


    <div id="message">
        Chưa lấy dữ liệu từ API
    </div>


    <!-- THỐNG KÊ -->

    <div class="info">

        <div class="box">

            <h3>Số lượng hàng</h3>

            <div id="tongHang" class="number">
                0
            </div>

        </div>


        <div class="box">

            <h3>Tổng tiền</h3>

            <div id="tongTien" class="number">
                0 VNĐ
            </div>

        </div>

    </div>


    <!-- BẢNG -->

    <table>

        <thead>

            <tr>
                <th>STT</th>
                <th>ID</th>
                <th>Tên hàng hóa</th>
                <th>Giá tiền</th>
                <th>Danh mục</th>
            </tr>

        </thead>

        <tbody id="hangHoaList">

            <tr>
                <td colspan="5">
                    Chưa có dữ liệu
                </td>
            </tr>

        </tbody>

    </table>

</div>


<!-- FOOTER -->

<footer>

    Website bán hàng - ThuyF

</footer>


<!-- JAVASCRIPT -->

<script>

    async function getHangHoa() {

        document.getElementById("message").innerText =
            "Đang lấy dữ liệu...";

        try {

            const response =
                await fetch("/api/hanghoa");

            if (!response.ok) {

                throw new Error(
                    "HTTP Error: " + response.status
                );

            }

            const data =
                await response.json();

            console.log("Dữ liệu API:", data);


            if (data.ok === 1) {

                document.getElementById("message").innerText =
                    data.msg;


                document.getElementById("tongHang").innerText =
                    data.tong_hang;


                document.getElementById("tongTien").innerText =
                    data.tong_tien.toLocaleString("vi-VN")
                    + " VNĐ";


                const list =
                    document.getElementById("hangHoaList");

                list.innerHTML = "";


                data.dshh.forEach(
                    function(hanghoa, index) {

                        const row =
                            document.createElement("tr");

                        row.innerHTML = `

                            <td>
                                ${index + 1}
                            </td>

                            <td>
                                ${hanghoa.id}
                            </td>

                            <td>
                                ${hanghoa.name}
                            </td>

                            <td>
                                ${hanghoa.money
                                    .toLocaleString("vi-VN")}
                                VNĐ
                            </td>

                            <td>
                                ${hanghoa.category}
                            </td>

                        `;

                        list.appendChild(row);

                    }
                );

            } else {

                document.getElementById("message").innerText =
                    "API trả về lỗi.";

            }

        }

        catch (error) {

            console.error(error);

            document.getElementById("message").innerText =
                "Không thể kết nối đến API Node-RED.";

        }

    }

</script>
