<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Website bán hàng - ThuyF</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 1000px;
            max-width: 95%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .info {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #eee;
        }

    </style>

</head>


<body>

<header>

    <h1>Website bán hàng</h1>

    <p>API Node-RED - Nginx - JavaScript</p>

</header>


<div class="container">

    <h2>Danh sách hàng hóa</h2>

    <button onclick="getHangHoa()">
        Lấy danh sách hàng hóa
    </button>


    <div id="message"></div>


    <div class="info">

        <div class="box">

            <strong>Số lượng hàng:</strong>

            <span id="tongHang">
                0
            </span>

        </div>


        <div class="box">

            <strong>Tổng tiền:</strong>

            <span id="tongTien">
                0
            </span>

            VNĐ

        </div>

    </div>


    <table>

        <thead>

            <tr>

                <th>STT</th>

                <th>ID</th>

                <th>Tên hàng hóa</th>

                <th>Giá tiền</th>

                <th>Danh mục</th>

            </tr>

        </thead>


        <tbody id="hangHoaList">

        </tbody>

    </table>

</div>


<script>


async function getHangHoa() {

    try {

        // Gọi API Node-RED
        const response = await fetch("/api/hanghoa");


        // Chuyển kết quả sang JSON
        const data = await response.json();


        console.log(data);


        // Kiểm tra API
        if (data.ok === 1) {

            document.getElementById("message").innerHTML =
                data.msg;


            // Hiển thị tổng số hàng
            document.getElementById("tongHang").innerHTML =
                data.tong_hang;


            // Hiển thị tổng tiền
            document.getElementById("tongTien").innerHTML =
                data.tong_tien.toLocaleString("vi-VN");


            // Lấy tbody
            const list =
                document.getElementById("hangHoaList");


            // Xóa dữ liệu cũ
            list.innerHTML = "";


            // Duyệt danh sách hàng hóa
            data.dshh.forEach(function(hanghoa, index) {


                const row = `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${hanghoa.id}
                        </td>

                        <td>
                            ${hanghoa.name}
                        </td>

                        <td>
                            ${hanghoa.money.toLocaleString("vi-VN")} VNĐ
                        </td>

                        <td>
                            ${hanghoa.category}
                        </td>

                    </tr>

                `;


                list.innerHTML += row;

            });


        } else {

            document.getElementById("message").innerHTML =
                "API trả về lỗi";

        }


    } catch (error) {

        console.error(error);


        document.getElementById("message").innerHTML =
            "Không thể kết nối đến API";

    }

}


</script>


</body>

</html>
